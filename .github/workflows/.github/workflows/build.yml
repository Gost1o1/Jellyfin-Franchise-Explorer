
name: Build and validate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Jellyfin.Plugin.FranchiseExplorer/Jellyfin.Plugin.FranchiseExplorer.csproj

      - name: Build plugin
        run: dotnet build src/Jellyfin.Plugin.FranchiseExplorer/Jellyfin.Plugin.FranchiseExplorer.csproj --configuration Release --no-restore

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin-Franchise-Explorer
          path: src/Jellyfin.Plugin.FranchiseExplorer/bin/Release/net10.0/
          if-no-files-found: error
