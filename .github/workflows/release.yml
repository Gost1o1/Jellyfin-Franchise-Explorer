name: Publish experimental release (manual approval only)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version; must equal csproj Version'
        required: true
        default: '0.8.9.2'
        type: string
      confirm:
        description: 'Type RELEASE_EXPERIMENTAL to publish'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: franchise-release
  cancel-in-progress: false
jobs:
  ui-browser:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'RELEASE_EXPERIMENTAL'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate browser UI before publishing
        working-directory: Jellyfin-Franchise-Explorer
        run: |
          python3 scripts/test_my_media_tile_browser.py
          python3 scripts/test_my_media_tile_resize.py
          python3 scripts/test_v085_native_card.py
          python3 scripts/test_v085_card_progress.py
          python3 scripts/test_v087_completion_handoff.py
          python3 scripts/test_v088_completion_recovery.py
          python3 scripts/test_v089_activation_browser.py
          python3 scripts/test_v0891_response_casing_browser.py
          python3 scripts/test_v0892_home_browser.py

  publish:
    needs: ui-browser
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'RELEASE_EXPERIMENTAL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check source, tests and version
        working-directory: Jellyfin-Franchise-Explorer
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/check_repo.py
          python3 scripts/check_repository_completeness.py
          python3 scripts/smoke_tests.py
          node scripts/ui_contract_tests.js
          python3 scripts/test_artwork_contract.py
          node scripts/test_inheritance.js
          node scripts/test_ranges_and_drag.js
          node scripts/test_tv_dialog_contract.js
          python3 scripts/test_responsive_layout.py
          node --check src/Jellyfin.Plugin.FranchiseExplorer/Web/franchise-my-media.js
          node --check src/Jellyfin.Plugin.FranchiseExplorer/Web/franchise-timeline.js
          python3 scripts/test_my_media_tile_static.py
          python3 scripts/test_rows_contract.py
          python3 scripts/test_full_library_row_contract.py
          python3 scripts/test_row_search_focus_contract.py
          node scripts/test_timeline_engine.js
          node scripts/test_v089_arming.js
          node scripts/test_v0891_timeline_json.js
          python3 scripts/test_timeline_contract.py
          python3 scripts/test_v089_activation_contract.py
          python3 scripts/test_v0891_json_contract.py
          python3 scripts/test_local_web_handoff_contract.py
          python3 scripts/test_v0892_home_contract.py
          python3 scripts/check_version.py "$RELEASE_VERSION"
      - name: Build release assembly
        working-directory: Jellyfin-Franchise-Explorer
        run: |
          dotnet restore src/Jellyfin.Plugin.FranchiseExplorer/Jellyfin.Plugin.FranchiseExplorer.csproj
          dotnet build src/Jellyfin.Plugin.FranchiseExplorer/Jellyfin.Plugin.FranchiseExplorer.csproj --no-restore -c Release
      - name: Package compiled DLL only
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          cd Jellyfin-Franchise-Explorer/src/Jellyfin.Plugin.FranchiseExplorer/bin/Release/net10.0
          zip -j "$GITHUB_WORKSPACE/dist/franchise-explorer_${RELEASE_VERSION}.zip" Jellyfin.Plugin.FranchiseExplorer.dll
          unzip -l "$GITHUB_WORKSPACE/dist/franchise-explorer_${RELEASE_VERSION}.zip"
      - name: Publish experimental GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" "dist/franchise-explorer_${RELEASE_VERSION}.zip" \
            --prerelease --title "Franchise Explorer ${RELEASE_VERSION} (EXPERIMENTAL)" \
            --notes "UNFINISHED EXPERIMENTAL VERSION. Virtual franchises and experimental chronological playback; back up your server and plugin data. Native-client compatibility remains unverified."
      - name: Generate Jellyfin catalog manifest from actual release ZIP
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 Jellyfin-Franchise-Explorer/scripts/publish_manifest.py \
            --version "$RELEASE_VERSION" \
            --archive "dist/franchise-explorer_${RELEASE_VERSION}.zip" \
            --repository "$GITHUB_REPOSITORY"
      - name: Commit and push catalog manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m "catalog: publish experimental ${RELEASE_VERSION}"
          git push origin HEAD:main
