name: Publish experimental release (manual approval only)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must equal csproj Version), e.g. 0.8.5.0'
        required: true
        default: '0.8.5.0'
        type: string
      confirm:
        description: 'Type RELEASE_EXPERIMENTAL to publish a Jellyfin catalog entry'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: franchise-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'RELEASE_EXPERIMENTAL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check version and files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/check_repo.py
          python3 scripts/smoke_tests.py
          node scripts/ui_contract_tests.js
          python3 scripts/test_artwork_contract.py
          node scripts/test_inheritance.js
          node scripts/test_ranges_and_drag.js
          node scripts/test_tv_dialog_contract.js
          python3 scripts/test_responsive_layout.py
          node --check src/Jellyfin.Plugin.FranchiseExplorer/Web/franchise-my-media.js
          python3 scripts/test_my_media_tile_static.py
          python3 scripts/test_rows_contract.py
          python3 scripts/test_full_library_row_contract.py
          python3 scripts/test_row_search_focus_contract.py
          node scripts/test_timeline_engine.js
          python3 scripts/test_timeline_contract.py
          python3 scripts/test_local_web_handoff_contract.py
          python3 scripts/check_version.py "$RELEASE_VERSION"
      - name: Build release assembly
        run: |
          dotnet restore src/Jellyfin.Plugin.FranchiseExplorer/Jellyfin.Plugin.FranchiseExplorer.csproj
          dotnet build src/Jellyfin.Plugin.FranchiseExplorer/Jellyfin.Plugin.FranchiseExplorer.csproj --no-restore -c Release
      - name: Package framework-free plugin ZIP
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          cd src/Jellyfin.Plugin.FranchiseExplorer/bin/Release/net10.0
          zip -j "$GITHUB_WORKSPACE/dist/franchise-explorer_${RELEASE_VERSION}.zip" Jellyfin.Plugin.FranchiseExplorer.dll
          unzip -l "$GITHUB_WORKSPACE/dist/franchise-explorer_${RELEASE_VERSION}.zip"
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" "dist/franchise-explorer_${RELEASE_VERSION}.zip" \
            --prerelease --title "Franchise Explorer ${RELEASE_VERSION} (EXPERIMENTAL)" \
            --notes "UNFINISHED EXPERIMENTAL VERSION. Early timeline playback using Jellyfin PlayNow queues, per-user progress, and optional web dashboard resume. Actual Jellyfin client compatibility is unverified; do not rely on unattended progress tracking. Back up the server and franchise artwork before installing."
      - name: Generate Jellyfin catalog manifest from actual ZIP
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/publish_manifest.py \
            --version "$RELEASE_VERSION" \
            --archive "dist/franchise-explorer_${RELEASE_VERSION}.zip" \
            --repository "$GITHUB_REPOSITORY"
      - name: Commit and push updated manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m "catalog: publish experimental ${RELEASE_VERSION}"
          git push origin HEAD:main
